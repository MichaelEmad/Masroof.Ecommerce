<abp-page [title]="'::Cart' | abpLocalization">
  <div class="row">
    <div class="col-md-8">
      <div class="card" *ngIf="cartItems.length > 0">
        <div class="card-body">
          <h5 class="card-title">Shopping Cart</h5>
          <table class="table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of cartItems">
                <td>
                  <div class="d-flex align-items-center">
                    <img [src]="item.productImageUrl || 'assets/images/placeholder.png'"
                         class="cart-item-image me-3"
                         alt="{{ item.productName }}">
                    <span>{{ item.productName }}</span>
                  </div>
                </td>
                <td>{{ item.productPrice | currency }}</td>
                <td>
                  <div class="input-group" style="width: 120px;">
                    <button class="btn btn-outline-secondary" type="button"
                            (click)="updateQuantity(item.id, item.quantity - 1)"
                            [disabled]="item.quantity <= 1">
                      <i class="fas fa-minus"></i>
                    </button>
                    <input type="text" class="form-control text-center"
                           [value]="item.quantity" readonly>
                    <button class="btn btn-outline-secondary" type="button"
                            (click)="updateQuantity(item.id, item.quantity + 1)">
                      <i class="fas fa-plus"></i>
                    </button>
                  </div>
                </td>
                <td>{{ item.totalPrice | currency }}</td>
                <td>
                  <button class="btn btn-danger btn-sm" (click)="removeItem(item.id)">
                    <i class="fas fa-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div *ngIf="cartItems.length === 0" class="text-center mt-5">
        <i class="fas fa-shopping-cart fa-5x text-muted mb-3"></i>
        <p>Your cart is empty</p>
        <a routerLink="/products" class="btn btn-primary">Continue Shopping</a>
      </div>
    </div>

    <div class="col-md-4" *ngIf="cartItems.length > 0">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Order Summary</h5>
          <hr>
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal:</span>
            <strong>{{ cartTotal | currency }}</strong>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-3">
            <h5>Total:</h5>
            <h5>{{ cartTotal | currency }}</h5>
          </div>
          <button class="btn btn-success w-100" (click)="checkout()">
            Proceed to Checkout
          </button>
        </div>
      </div>
    </div>
  </div>
</abp-page>
