<abp-page [title]="'::Checkout' | abpLocalization">
  <div class="row">
    <div class="col-md-8">
      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title">Order Items</h5>
          <table class="table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of cartItems">
                <td>
                  <div class="d-flex align-items-center">
                    <img [src]="item.productImageUrl || 'assets/images/placeholder.png'"
                         class="cart-item-image me-3"
                         alt="{{ item.productName }}">
                    <span>{{ item.productName }}</span>
                  </div>
                </td>
                <td>{{ item.productPrice | currency }}</td>
                <td>{{ item.quantity }}</td>
                <td>{{ item.totalPrice | currency }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Order Summary</h5>
          <hr>
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal:</span>
            <strong>{{ cartTotal | currency }}</strong>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-3">
            <h5>Total:</h5>
            <h5>{{ cartTotal | currency }}</h5>
          </div>
          <button
            class="btn btn-success w-100 mb-2"
            (click)="placeOrder()"
            [disabled]="processing || cartItems.length === 0">
            <span *ngIf="!processing">Place Order</span>
            <span *ngIf="processing">
              <i class="fas fa-spinner fa-spin"></i> Processing...
            </span>
          </button>
          <a routerLink="/cart" class="btn btn-outline-secondary w-100">
            Back to Cart
          </a>
        </div>
      </div>
    </div>
  </div>
</abp-page>
