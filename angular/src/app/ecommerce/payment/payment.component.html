<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Complete Payment</h4>
        </div>
        <div class="card-body">
          <!-- Loading State -->
          <div *ngIf="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Loading payment form...</p>
          </div>

          <!-- Error Message -->
          <div *ngIf="errorMessage && !loading" class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            {{ errorMessage }}
          </div>

          <!-- Order Summary -->
          <div *ngIf="orderDetails && !loading" class="mb-4">
            <h5 class="border-bottom pb-2 mb-3">Order Summary</h5>
            <div class="row">
              <div class="col-6">
                <p class="text-muted mb-1">Order Number:</p>
                <p class="fw-bold">{{ orderDetails.orderNumber }}</p>
              </div>
              <div class="col-6 text-end">
                <p class="text-muted mb-1">Total Amount:</p>
                <p class="fw-bold fs-4 text-primary">${{ orderDetails.totalAmount.toFixed(2) }}</p>
              </div>
            </div>
          </div>

          <!-- Payment Form -->
          <form *ngIf="!loading && !errorMessage" (submit)="handleSubmit($event)">
            <!-- Stripe Payment Element -->
            <div id="payment-element" class="mb-4">
              <!-- Stripe.js will inject the Payment Element here -->
            </div>

            <!-- Payment Error Message -->
            <div *ngIf="errorMessage" class="alert alert-danger mb-3" role="alert">
              {{ errorMessage }}
            </div>

            <!-- Submit Button -->
            <div class="d-grid gap-2">
              <button
                type="submit"
                class="btn btn-primary btn-lg"
                [disabled]="processing || loading">
                <span *ngIf="!processing">
                  <i class="fas fa-lock me-2"></i>
                  Pay ${{ orderDetails?.totalAmount.toFixed(2) }}
                </span>
                <span *ngIf="processing">
                  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  Processing...
                </span>
              </button>

              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="cancelPayment()"
                [disabled]="processing">
                Cancel
              </button>
            </div>
          </form>

          <!-- Security Notice -->
          <div *ngIf="!loading && !errorMessage" class="mt-4 text-center">
            <small class="text-muted">
              <i class="fas fa-shield-alt me-1"></i>
              Payments are securely processed by Stripe
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
