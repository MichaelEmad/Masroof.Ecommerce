services:
  ecommerce-angular:
    image: masroof/ecommerce-angular:latest
    container_name: ecommerce-angular
    build:
      context: ../../
      dockerfile: angular/Dockerfile.local
    ports:
      - "4200:80"
    depends_on:
      - ecommerce-api
    volumes:
      - ./dynamic-env.json://usr/share/nginx/html/dynamic-env.json
    networks:
      - abp-network

  ecommerce-api:
    image: masroof/ecommerce-api:latest
    container_name: ecommerce-api
    hostname: ecommerce-api
    build:
      context: ../../
      dockerfile: src/Masroof.Ecommerce.HttpApi.Host/Dockerfile.local
    environment:
      - ASPNETCORE_URLS=https://+:8081;http://+:8080;
      - Kestrel__Certificates__Default__Path=/app/certs/localhost.pfx
      - Kestrel__Certificates__Default__Password=213ef8e0-7b70-4dd0-845a-e26ec735aebd
      - App__SelfUrl=https://localhost:44346
      - App__AngularUrl=http://localhost:4200
      - App_CorsOrigins=http://localhost:4200
      - App__HealthCheckUrl=http://ecommerce-api:8080/health-status
      - AuthServer__RequireHttpsMetadata=false
      - AuthServer__Authority=https://localhost:44302
      - App__RedirectAllowedUrls=http://localhost:4200
      - ConnectionStrings__Default=Data Source=sql-server;Initial Catalog=Ecommerce;User Id=sa;Password=myPassw0rd;MultipleActiveResultSets=true;TrustServerCertificate=True;
    ports:
      - "44302:8081"
    depends_on:
      sql-server:
        condition: service_healthy
    restart: on-failure    
    volumes:
      - ./certs:/app/certs
    networks:
      - abp-network
  

  db-migrator:
    image: masroof/ecommerce-db-migrator:latest
    container_name: db-migrator
    build:
      context: ../../
      dockerfile: src/Masroof.Ecommerce.DbMigrator/Dockerfile.local
    environment:
      - OpenIddict__Applications__Ecommerce_App__RootUrl=http://localhost:4200
      - OpenIddict__Applications__Ecommerce_Swagger__RootUrl=https://localhost:44302
      - ConnectionStrings__Default=Data Source=sql-server;Initial Catalog=Ecommerce;User Id=sa;Password=myPassw0rd;MultipleActiveResultSets=true;TrustServerCertificate=True;
    restart: on-failure
    depends_on:
      sql-server:
        condition: service_healthy
    networks:
      - abp-network    
  
  sql-server:
    container_name: sql-server
    image: mcr.microsoft.com/azure-sql-edge:1.0.7
    ports:
      - "1434:1433"
    environment:
      SA_PASSWORD: "myPassw0rd"
      ACCEPT_EULA: "Y"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - abp-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S sql-server -U sa -P "myPassw0rd" -Q "SELECT 1" -C -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
volumes:
  sqldata:
    name: ecommerce_sqldata
networks:
  abp-network:
    name: ecommerce-network
    driver: bridge
